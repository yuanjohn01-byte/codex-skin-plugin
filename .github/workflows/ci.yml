name: Public Plugin Baseline

on:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      profile:
        description: Checks to run
        required: true
        type: choice
        default: paid-alpha
        options:
          - paid-alpha
          - full

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-boundary:
    runs-on: ubuntu-latest
    outputs:
      ci_profile: ${{ steps.scope.outputs.ci_profile }}
      run_fixture: ${{ steps.scope.outputs.run_fixture }}
      run_go: ${{ steps.scope.outputs.run_go }}
      run_helper_build: ${{ steps.scope.outputs.run_helper_build }}
      run_guardian_lifecycle: ${{ steps.scope.outputs.run_guardian_lifecycle }}
      run_macos_signing: ${{ steps.scope.outputs.run_macos_signing }}
      run_windows_signing: ${{ steps.scope.outputs.run_windows_signing }}
      run_windows_plugin: ${{ steps.scope.outputs.run_windows_plugin }}
      run_full: ${{ steps.scope.outputs.run_full }}
      run_complete_full: ${{ steps.scope.outputs.run_complete_full }}
      lightweight_main: ${{ steps.scope.outputs.lightweight_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select fail-closed component checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python3 tools/ci_scope.py
          --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --manual-profile "${{ inputs.profile || 'full' }}"
          >> "$GITHUB_OUTPUT"
      - name: Compile repository validators
        run: python3 -m compileall -q tools
      - name: Test CI scope selection
        run: python3 tools/test_ci_scope.py
      - name: Test CI trigger and concurrency policy
        run: python3 tools/test_ci_workflows.py
      - name: Test manifest, license, and Public upload boundary
        run: python3 tools/test_public_repository.py
      - name: Validate the exported Free Theme Manifest v1 fixture
        if: steps.scope.outputs.run_fixture == 'true'
        run: python3 tools/test_theme_fixture.py
      - name: Test Free Theme fixture exact-schema rejections
        if: steps.scope.outputs.run_fixture == 'true'
        run: python3 tools/test_theme_fixture_validation.py
      - uses: actions/setup-go@v5
        if: steps.scope.outputs.run_go == 'true'
        with:
          go-version: "1.26.5"
          cache: true
      - name: Check Go formatting
        if: steps.scope.outputs.run_go == 'true'
        run: >-
          test -z "$(gofmt -l
          cmd/codex-skin
          internal/adapter
          internal/appearance
          internal/bootstrap
          internal/browseropen
          internal/buildinfo
          internal/cdp
          internal/cli
          internal/codex
          internal/credentials
          internal/deviceauth
          internal/engine
          internal/flowstate
          internal/protocol
          internal/release
          internal/restartflow
          internal/sessionflow
          internal/theme
          internal/themeapi
          internal/userflow
          tools/gateb_calibration)"
      - name: Vet the Helper
        if: steps.scope.outputs.run_go == 'true'
        run: >-
          go vet
          ./cmd/codex-skin
          ./internal/adapter
          ./internal/appearance
          ./internal/bootstrap
          ./internal/browseropen
          ./internal/buildinfo
          ./internal/cdp
          ./internal/cli
          ./internal/codex
          ./internal/credentials
          ./internal/deviceauth
          ./internal/engine
          ./internal/flowstate
          ./internal/protocol
          ./internal/release
          ./internal/restartflow
          ./internal/sessionflow
          ./internal/theme
          ./internal/themeapi
          ./internal/userflow
          ./tools/gateb_calibration
      - name: Test the Helper and JSONL contract
        if: steps.scope.outputs.run_go == 'true'
        run: >-
          go test
          ./cmd/codex-skin
          ./internal/adapter
          ./internal/appearance
          ./internal/bootstrap
          ./internal/browseropen
          ./internal/buildinfo
          ./internal/cdp
          ./internal/cli
          ./internal/codex
          ./internal/credentials
          ./internal/deviceauth
          ./internal/engine
          ./internal/flowstate
          ./internal/protocol
          ./internal/release
          ./internal/restartflow
          ./internal/sessionflow
          ./internal/theme
          ./internal/themeapi
          ./internal/userflow
          ./tools/gateb_calibration

  full-helper-build:
    needs: repository-boundary
    if: needs.repository-boundary.outputs.run_helper_build == 'true'
    uses: ./.github/workflows/helper-build-spike.yml
    permissions:
      contents: read

  full-guardian-lifecycle:
    needs: repository-boundary
    if: needs.repository-boundary.outputs.run_guardian_lifecycle == 'true'
    uses: ./.github/workflows/guardian-lifecycle-spike.yml
    permissions:
      contents: read

  full-macos-signing:
    needs: repository-boundary
    if: needs.repository-boundary.outputs.run_macos_signing == 'true'
    uses: ./.github/workflows/macos-signing-spike.yml
    permissions:
      contents: read

  full-windows-signing:
    needs: repository-boundary
    if: needs.repository-boundary.outputs.run_windows_signing == 'true'
    uses: ./.github/workflows/windows-signing-spike.yml
    permissions:
      contents: read

  full-windows-plugin:
    needs: repository-boundary
    if: needs.repository-boundary.outputs.run_windows_plugin == 'true'
    uses: ./.github/workflows/windows-plugin-spike.yml
    permissions:
      contents: read

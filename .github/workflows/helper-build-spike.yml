name: Helper Cross-Platform Build Spike

on:
  workflow_dispatch:
    inputs:
      run_profile:
        description: "full runs CI; signed profiles create one protected, unpublished channel-specific candidate"
        required: true
        default: full
        type: choice
        options:
          - full
          - signed-staging-only
          - signed-production-only
          - windows-test-build-only
          - signed-windows-test-only
      candidate_sha:
        description: "Windows test profiles require the exact 40-character SHA on codex/win-002-test-channel"
        required: false
        type: string
      build_run_id:
        description: "Signing only: successful windows-test-build-only run ID for the same candidate SHA"
        required: false
        type: string
      windows_test_confirmation:
        description: "Signing only: SIGN WINDOWS TEST followed by the exact candidate SHA"
        required: false
        type: string
      production_confirmation:
        description: "For signed-production-only, type: RELEASE https://codexskin.ai HELPER .17 BOOTSTRAP .16"
        required: false
        type: string
  workflow_call:

concurrency:
  group: helper-build-spike-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-test-build:
    if: github.event_name == 'workflow_dispatch' && inputs.run_profile == 'windows-test-build-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Check and build the exact opt-in candidate without secrets
        id: freeze
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/win-002-test-channel"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          python3 tools/test_windows_test_candidate.py
          python3 tools/test_release_profiles.py
          python3 tools/windows_test_candidate.py --candidate-sha "$CANDIDATE_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-unsigned-${{ github.sha }}
          path: dist/windows-test
          if-no-files-found: error
          retention-days: 14

  windows-test-native:
    if: github.event_name == 'workflow_dispatch' && inputs.run_profile == 'windows-test-build-only'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Execute candidate installation, appearance, restore and entry regressions
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/codex/win-002-test-channel' -or $env:GITHUB_SHA -ne $env:CANDIDATE_SHA) { throw 'Candidate ref mismatch' }
          python tools/build_helper.py --target windows-x64 --release-profile windows-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_bootstrap.py --target windows-x64 --release-profile windows-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:CODEX_SKIN_TEST_HELPER = (Resolve-Path 'dist/helper/codex-skin-helper_0.1.0-paid-alpha.17.windows.1_windows_x64.exe').Path
          go test -count=1 -failfast -timeout=4m ./internal/bootstrap ./internal/bootstrapcli ./internal/release ./internal/releasesigning ./internal/codex ./internal/appearance ./internal/engine ./internal/restartflow ./internal/userflow ./tools/windows_plugin_entry_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bootstrap = (Resolve-Path 'dist/bootstrap/codex-skin-bootstrap_0.1.0-paid-alpha.16.windows.1_windows_x64.exe').Path
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($tool in @('node', 'python', 'go')) { if (Get-Command $tool -ErrorAction SilentlyContinue) { throw 'Developer tool remained on PATH' } }
          $version = (& $env:CODEX_SKIN_TEST_HELPER version --json) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $version.ok -or $version.data.helperVersion -ne '0.1.0-paid-alpha.17.windows.1' -or $version.data.apiOrigin -ne 'https://codexskin.ai' -or $version.data.buildCommit -ne $env:CANDIDATE_SHA) { throw 'Candidate Helper identity mismatch' }
          $version = (& $bootstrap version --json) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $version.ok -or $version.data.bootstrapVersion -ne '0.1.0-paid-alpha.16.windows.1' -or $version.data.releaseTag -ne 'helper-v0.1.0-paid-alpha.17.windows.1') { throw 'Candidate Bootstrap identity mismatch' }

  windows-test-evidence:
    if: github.event_name == 'workflow_dispatch' && inputs.run_profile == 'signed-windows-test-only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.evidence.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reuse successful exact-SHA build and platform evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/win-002-test-channel"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > build-jobs.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > build-artifacts.json
          python3 tools/verify_windows_test_run.py "$CANDIDATE_SHA" "$BUILD_RUN_ID" >> "$GITHUB_OUTPUT"

  windows-test-sign:
    if: github.event_name == 'workflow_dispatch' && inputs.run_profile == 'signed-windows-test-only'
    needs: windows-test-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: paid-alpha-production-release
    permissions:
      contents: read
      actions: read
    steps:
      # Candidate source never runs in the signing job. The environment reviewer
      # must approve this workflow's exact SHA, not just its branch name.
      - uses: actions/checkout@v4
        with:
          ref: 45f16ea2f63d4d60419dab65ede1f87b1471f80f
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows-test-evidence.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
          path: candidate
      - name: Validate signing intent and exact descriptor bytes
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONFIRMATION: ${{ inputs.windows_test_confirmation }}
        run: |
          test "$GITHUB_REF" = "refs/heads/codex/win-002-test-channel"
          test "$GITHUB_SHA" = "$CANDIDATE_SHA"
          test "$CONFIRMATION" = "SIGN WINDOWS TEST $CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "45f16ea2f63d4d60419dab65ede1f87b1471f80f"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          candidate = json.loads(Path('candidate/candidate.json').read_text())
          descriptor = json.loads(Path('candidate/helper/helper-release-descriptor.json').read_text())
          assert candidate['candidateSHA'] == os.environ['CANDIDATE_SHA']
          assert candidate['channel'] == 'windows-test'
          assert candidate['descriptorSHA256'] == hashlib.sha256(Path('candidate/helper/helper-release-descriptor.json').read_bytes()).hexdigest()
          assert candidate['marketplaceSHA256'] == hashlib.sha256(Path('candidate/windows-test-marketplace.zip').read_bytes()).hexdigest()
          assert descriptor['helperVersion'] == '0.1.0-paid-alpha.17.windows.1'
          assert descriptor['releaseTag'] == 'helper-v0.1.0-paid-alpha.17.windows.1'
          assert descriptor['signingKeyId'] == 'helper-production-2026-08'
          PY
      - name: Sign using only the pinned trusted signer
        env:
          CODEX_SKIN_HELPER_RELEASE_PRIVATE_KEY_PEM_B64: ${{ secrets.CODEX_SKIN_HELPER_RELEASE_PRIVATE_KEY_PEM_B64 }}
        run: |
          go run ./cmd/codex-skin-sign-helper-release \
            --descriptor candidate/helper/helper-release-descriptor.json \
            --signature candidate/helper/helper-release-descriptor.sig
          test "$(wc -c < candidate/helper/helper-release-descriptor.sig)" -eq 64
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-signed-${{ github.sha }}
          path: candidate
          if-no-files-found: error
          retention-days: 14

  signed-staging-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_profile == 'signed-staging-only'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: paid-alpha-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Resolve exact candidate build provenance
        id: inputs
        run: |
          candidate_sha=$(git rev-parse HEAD)
          test "$candidate_sha" = "${{ github.sha }}"
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "helper_built_at=$(git show -s --format=%cI "$candidate_sha")" >> "$GITHUB_OUTPUT"
      - name: Build deterministic fixed-profile Staging Helper and Bootstrap candidate
        run: |
          python3 tools/build_helper.py \
            --commit "${{ steps.inputs.outputs.candidate_sha }}" \
            --built-at "${{ steps.inputs.outputs.helper_built_at }}" \
            --release-profile staging
          python3 tools/build_bootstrap.py \
            --commit "${{ steps.inputs.outputs.candidate_sha }}" \
            --built-at "${{ steps.inputs.outputs.helper_built_at }}" \
            --release-profile staging
          python3 tools/create_sbom.py \
            --summary dist/helper/build-summary.json \
            --release-profile staging
          python3 tools/create_release_descriptor.py \
            --key-id helper-alpha-2026-08 \
            --release-profile staging
          python3 tools/render_bootstrap_pins.py \
            --summary dist/bootstrap/build-summary.json \
            --release-profile staging \
            --shell-output dist/bootstrap/pins/bootstrap-pins.sh \
            --powershell-output dist/bootstrap/pins/bootstrap-pins.ps1
      - name: Sign and verify canonical Helper release descriptor
        env:
          CODEX_SKIN_HELPER_RELEASE_PRIVATE_KEY_PEM_B64: ${{ secrets.CODEX_SKIN_HELPER_RELEASE_PRIVATE_KEY_PEM_B64 }}
        run: |
          go run ./cmd/codex-skin-sign-helper-release \
            --descriptor dist/helper/helper-release-descriptor.json \
            --signature dist/helper/helper-release-descriptor.sig
          test "$(wc -c < dist/helper/helper-release-descriptor.sig)" -eq 64
          go test ./internal/release ./internal/releasesigning ./internal/bootstrap ./internal/bootstrapcli
      - name: Upload signed candidate without publishing a Release
        uses: actions/upload-artifact@v4
        with:
          name: signed-helper-0.1.0-paid-alpha.16-bootstrap-0.1.0-paid-alpha.15-${{ steps.inputs.outputs.candidate_sha }}-staging
          path: |
            dist/helper
            dist/bootstrap
          if-no-files-found: error
          retention-days: 7

  signed-production-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_profile == 'signed-production-only' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: paid-alpha-production-release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Confirm and freeze the exact Production candidate
        id: inputs
        env:
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          test "$PRODUCTION_CONFIRMATION" = "RELEASE https://codexskin.ai HELPER .17 BOOTSTRAP .16"
          candidate_sha=$(git rev-parse HEAD)
          test "$candidate_sha" = "${{ github.sha }}"
          if git show-ref --verify --quiet refs/tags/helper-v0.1.0-paid-alpha.17; then
            echo "Production Helper version 0.1.0-paid-alpha.17 is already immutable." >&2
            exit 1
          fi
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "helper_built_at=$(git show -s --format=%cI "$candidate_sha")" >> "$GITHUB_OUTPUT"
      - name: Build deterministic fixed-profile Production Helper and Bootstrap candidate
        run: |
          python3 tools/build_helper.py \
            --commit "${{ steps.inputs.outputs.candidate_sha }}" \
            --built-at "${{ steps.inputs.outputs.helper_built_at }}" \
            --release-profile production
          python3 tools/build_bootstrap.py \
            --commit "${{ steps.inputs.outputs.candidate_sha }}" \
            --built-at "${{ steps.inputs.outputs.helper_built_at }}" \
            --release-profile production
          python3 tools/create_sbom.py \
            --summary dist/helper/build-summary.json \
            --release-profile production
          python3 tools/create_release_descriptor.py \
            --key-id helper-production-2026-08 \
            --release-profile production
          python3 tools/render_bootstrap_pins.py \
            --summary dist/bootstrap/build-summary.json \
            --release-profile production \
            --shell-output dist/bootstrap/pins/bootstrap-pins.sh \
            --powershell-output dist/bootstrap/pins/bootstrap-pins.ps1
      - name: Sign and verify canonical Production Helper release descriptor
        env:
          CODEX_SKIN_HELPER_RELEASE_PRIVATE_KEY_PEM_B64: ${{ secrets.CODEX_SKIN_HELPER_RELEASE_PRIVATE_KEY_PEM_B64 }}
        run: |
          go run ./cmd/codex-skin-sign-helper-release \
            --descriptor dist/helper/helper-release-descriptor.json \
            --signature dist/helper/helper-release-descriptor.sig
          test "$(wc -c < dist/helper/helper-release-descriptor.sig)" -eq 64
          python3 tools/test_release_profiles.py
          go test ./internal/release ./internal/releasesigning ./internal/bootstrap ./internal/bootstrapcli
      - name: Upload signed Production candidate without publishing a Release
        uses: actions/upload-artifact@v4
        with:
          name: signed-helper-0.1.0-paid-alpha.17-bootstrap-0.1.0-paid-alpha.16-${{ steps.inputs.outputs.candidate_sha }}-production
          path: |
            dist/helper
            dist/bootstrap
          if-no-files-found: error
          retention-days: 7

  reproducible-cross-build:
    if: github.event_name != 'workflow_dispatch' || inputs.run_profile == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build twice and compare three targets
        run: python3 tools/test_helper_builds.py
      - name: Build Bootstrap launchers twice and compare three targets
        run: python3 tools/test_bootstrap_builds.py
      - name: Test canonical release descriptor generation
        run: python3 tools/test_release_descriptor.py
      - name: Test deterministic Helper release SBOM
        run: python3 tools/test_create_sbom.py
      - name: Test fixed Staging and Production release profiles
        run: python3 tools/test_release_profiles.py
      - name: Test isolated Windows candidate packaging and signing boundaries
        run: python3 tools/test_windows_test_candidate.py
      - name: Build review artifacts
        run: python3 tools/build_helper.py
      - name: Build Bootstrap review artifacts
        run: python3 tools/build_bootstrap.py
      - name: Generate Helper release SBOM
        run: python3 tools/create_sbom.py --summary dist/helper/build-summary.json
      - name: Generate unsigned review descriptor
        run: >-
          python3 tools/create_release_descriptor.py
          --key-id internal-spike-2026-01
      - name: Upload unsigned internal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helper-cross-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/helper
            dist/bootstrap
          if-no-files-found: error
          retention-days: 14

  windows-no-node-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.run_profile == 'full'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build the native Windows x64 Helper
        shell: pwsh
        run: python tools/build_helper.py --target windows-x64 --release-profile production
      - name: Build the native Windows x64 Bootstrap launcher
        shell: pwsh
        run: python tools/build_bootstrap.py --target windows-x64 --release-profile production
      - name: Verify Windows CI native failure propagation
        shell: pwsh
        run: python tools/test_windows_ci_exit.py
      - name: Check bounded Windows PowerShell startup paths
        shell: pwsh
        run: |
          go test -count=1 -timeout=2m -v ./internal/codex -run '^TestWindowsPowerShell(StartupMatrix|IgnoresInheritedModuleSearch)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows identity, theme transaction, offline restore, bootstrap, and credentials
        shell: pwsh
        run: |
          $env:CODEX_SKIN_TEST_HELPER = (Resolve-Path 'dist/helper/codex-skin-helper_0.1.0-paid-alpha.17_windows_x64.exe').Path
          go test -count=1 -failfast -timeout=4m ./cmd/codex-skin ./internal/adapter ./internal/appearance ./internal/bootstrap ./internal/browseropen ./internal/buildinfo ./internal/cdp ./internal/cli ./internal/codex ./internal/credentials ./internal/deviceauth ./internal/engine ./internal/flowstate ./internal/protocol ./internal/release ./internal/restartflow ./internal/theme ./internal/themeapi ./internal/userflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./tools/windows_plugin_entry_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute without Node, Python, or Go on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Resolve-Path 'dist/helper/codex-skin-helper_0.1.0-paid-alpha.17_windows_x64.exe'
          $bootstrap = Resolve-Path 'dist/bootstrap/codex-skin-bootstrap_0.1.0-paid-alpha.16_windows_x64.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'Node remained on the smoke-test PATH' }
          if (Get-Command python -ErrorAction SilentlyContinue) { throw 'Python remained on the smoke-test PATH' }
          if (Get-Command go -ErrorAction SilentlyContinue) { throw 'Go remained on the smoke-test PATH' }

          $version = (& $helper version --json) | ConvertFrom-Json
          if (-not $version.ok -or $version.data.helperVersion -ne '0.1.0-paid-alpha.17' -or $version.data.helperReleaseTag -ne 'helper-v0.1.0-paid-alpha.17' -or $version.data.apiOrigin -ne 'https://codexskin.ai') {
            throw 'Windows Helper version contract failed'
          }
          $doctor = (& $helper doctor --json) | ConvertFrom-Json
          if (-not $doctor.ok -or $doctor.data.platform -ne 'windows' -or $doctor.data.architecture -ne 'x64' -or $doctor.data.nodeRequired) {
            throw 'Windows Helper doctor contract failed'
          }
          $bootstrapVersion = (& $bootstrap version --json) | ConvertFrom-Json
          if (-not $bootstrapVersion.ok -or $bootstrapVersion.data.bootstrapVersion -ne '0.1.0-paid-alpha.16' -or $bootstrapVersion.data.releaseTag -ne 'helper-v0.1.0-paid-alpha.17') {
            throw 'Windows Bootstrap version contract failed'
          }

  macos-no-node-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.run_profile == 'full' || inputs.run_profile == 'windows-test-build-only'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Test native Keychain storage and token rotation client plus identity, theme transaction, and offline restore
        run: go test -count=1 ./internal/adapter ./internal/appearance ./internal/browseropen ./internal/cdp ./internal/cli ./internal/codex ./internal/credentials ./internal/deviceauth ./internal/engine ./internal/flowstate ./internal/restartflow ./internal/theme ./internal/themeapi ./internal/userflow
      - name: Build the native macOS Helper
        id: native
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            target="macos-arm64"
            suffix="macos_arm64"
          else
            target="macos-x64"
            suffix="macos_x64"
          fi
          python3 tools/build_helper.py --target "$target" --release-profile production
          echo "helper=dist/helper/codex-skin-helper_0.1.0-paid-alpha.17_$suffix" >> "$GITHUB_OUTPUT"
          python3 tools/build_bootstrap.py --target "$target" --release-profile production
          echo "bootstrap=dist/bootstrap/codex-skin-bootstrap_0.1.0-paid-alpha.16_$suffix" >> "$GITHUB_OUTPUT"
      - name: Execute without Node or Go on PATH
        env:
          HELPER_PATH: ${{ steps.native.outputs.helper }}
        run: |
          export PATH="/usr/bin:/bin"
          if command -v node >/dev/null; then
            echo "Node remained on the smoke-test PATH" >&2
            exit 1
          fi
          if command -v go >/dev/null; then
            echo "Go remained on the smoke-test PATH" >&2
            exit 1
          fi
          "$HELPER_PATH" version --json | grep -F '"helperVersion":"0.1.0-paid-alpha.17"'
          "$HELPER_PATH" version --json | grep -F '"helperReleaseTag":"helper-v0.1.0-paid-alpha.17"'
          "$HELPER_PATH" version --json | grep -F '"apiOrigin":"https://codexskin.ai"'
          "$HELPER_PATH" doctor --json | grep -F '"nodeRequired":false'
          "${{ steps.native.outputs.bootstrap }}" version --json | grep -F '"bootstrapVersion":"0.1.0-paid-alpha.16"'
          "${{ steps.native.outputs.bootstrap }}" version --json | grep -F '"releaseTag":"helper-v0.1.0-paid-alpha.17"'
      - name: Exercise the Plugin to Bootstrap to external Helper entry
        run: python3 tools/test_plugin_bootstrap_entry.py

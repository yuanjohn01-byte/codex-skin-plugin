name: Helper Cross-Platform Build Spike

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: helper-build-spike-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproducible-cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build twice and compare three targets
        run: python3 tools/test_helper_builds.py
      - name: Build Bootstrap launchers twice and compare three targets
        run: python3 tools/test_bootstrap_builds.py
      - name: Test canonical release descriptor generation
        run: python3 tools/test_release_descriptor.py
      - name: Build review artifacts
        run: python3 tools/build_helper.py
      - name: Build Bootstrap review artifacts
        run: python3 tools/build_bootstrap.py
      - name: Generate unsigned review descriptor
        run: >-
          python3 tools/create_release_descriptor.py
          --key-id internal-spike-2026-01
      - name: Upload unsigned internal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: helper-cross-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/helper
            dist/bootstrap
          if-no-files-found: error
          retention-days: 14

  windows-no-node-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Build the native Windows x64 Helper
        shell: pwsh
        run: python tools/build_helper.py --target windows-x64
      - name: Build the native Windows x64 Bootstrap launcher
        shell: pwsh
        run: python tools/build_bootstrap.py --target windows-x64
      - name: Test Windows identity, theme transaction, offline restore, bootstrap, and credentials
        shell: pwsh
        run: |
          $env:CODEX_SKIN_TEST_HELPER = (Resolve-Path 'dist/helper/codex-skin-helper_0.1.0-paid-alpha_windows_x64.exe').Path
          go test ./cmd/codex-skin ./internal/adapter ./internal/appearance ./internal/bootstrap ./internal/browseropen ./internal/buildinfo ./internal/cdp ./internal/cli ./internal/codex ./internal/credentials ./internal/deviceauth ./internal/engine ./internal/flowstate ./internal/protocol ./internal/release ./internal/restartflow ./internal/theme ./internal/themeapi ./internal/userflow
          go test -count=1 ./tools/windows_plugin_entry_test
      - name: Execute without Node, Python, or Go on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Resolve-Path 'dist/helper/codex-skin-helper_0.1.0-paid-alpha_windows_x64.exe'
          $bootstrap = Resolve-Path 'dist/bootstrap/codex-skin-bootstrap_0.1.0-paid-alpha_windows_x64.exe'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          if (Get-Command node -ErrorAction SilentlyContinue) { throw 'Node remained on the smoke-test PATH' }
          if (Get-Command python -ErrorAction SilentlyContinue) { throw 'Python remained on the smoke-test PATH' }
          if (Get-Command go -ErrorAction SilentlyContinue) { throw 'Go remained on the smoke-test PATH' }

          $version = (& $helper version --json) | ConvertFrom-Json
          if (-not $version.ok -or $version.data.helperVersion -ne '0.1.0-paid-alpha') {
            throw 'Windows Helper version contract failed'
          }
          $doctor = (& $helper doctor --json) | ConvertFrom-Json
          if (-not $doctor.ok -or $doctor.data.platform -ne 'windows' -or $doctor.data.architecture -ne 'x64' -or $doctor.data.nodeRequired) {
            throw 'Windows Helper doctor contract failed'
          }
          $bootstrapVersion = (& $bootstrap version --json) | ConvertFrom-Json
          if (-not $bootstrapVersion.ok -or $bootstrapVersion.data.bootstrapVersion -ne '0.1.0-paid-alpha') {
            throw 'Windows Bootstrap version contract failed'
          }

  macos-no-node-smoke:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - name: Test native Keychain storage and token rotation client plus identity, theme transaction, and offline restore
        run: go test -count=1 ./internal/adapter ./internal/appearance ./internal/browseropen ./internal/cdp ./internal/cli ./internal/codex ./internal/credentials ./internal/deviceauth ./internal/engine ./internal/flowstate ./internal/restartflow ./internal/theme ./internal/themeapi ./internal/userflow
      - name: Build the native macOS Helper
        id: native
        run: |
          if [[ "$(uname -m)" == "arm64" ]]; then
            target="macos-arm64"
            suffix="macos_arm64"
          else
            target="macos-x64"
            suffix="macos_x64"
          fi
          python3 tools/build_helper.py --target "$target"
          echo "helper=dist/helper/codex-skin-helper_0.1.0-paid-alpha_$suffix" >> "$GITHUB_OUTPUT"
          python3 tools/build_bootstrap.py --target "$target"
          echo "bootstrap=dist/bootstrap/codex-skin-bootstrap_0.1.0-paid-alpha_$suffix" >> "$GITHUB_OUTPUT"
      - name: Execute without Node or Go on PATH
        env:
          HELPER_PATH: ${{ steps.native.outputs.helper }}
        run: |
          export PATH="/usr/bin:/bin"
          if command -v node >/dev/null; then
            echo "Node remained on the smoke-test PATH" >&2
            exit 1
          fi
          if command -v go >/dev/null; then
            echo "Go remained on the smoke-test PATH" >&2
            exit 1
          fi
          "$HELPER_PATH" version --json | grep -F '"helperVersion":"0.1.0-paid-alpha"'
          "$HELPER_PATH" doctor --json | grep -F '"nodeRequired":false'
          "${{ steps.native.outputs.bootstrap }}" version --json | grep -F '"bootstrapVersion":"0.1.0-paid-alpha"'
      - name: Exercise the Plugin to Bootstrap to external Helper entry
        run: python3 tools/test_plugin_bootstrap_entry.py
